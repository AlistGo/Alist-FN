name: Sync AList release

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "AList version/tag (empty means latest stable release)"
        required: false
        type: string
      force:
        description: "Rebuild and replace assets if this release already exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: sync-alist-release
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: AlistGo/alist
  FNPACK_VERSION: 1.2.3

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.detect.outputs.should_build }}
      upstream_tag: ${{ steps.detect.outputs.upstream_tag }}
      version: ${{ steps.detect.outputs.version }}
      release_tag: ${{ steps.detect.outputs.release_tag }}
    steps:
      - name: Resolve upstream release
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          FORCE_BUILD: ${{ inputs.force }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -n "${REQUESTED_VERSION:-}" ]]; then
            upstream_tag="$REQUESTED_VERSION"
            [[ "$upstream_tag" == v* ]] || upstream_tag="v${upstream_tag}"
            release_json="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/tags/${upstream_tag}")"
          else
            release_json="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest")"
            upstream_tag="$(jq -r '.tag_name' <<<"$release_json")"
          fi

          if [[ "$(jq -r '.draft or .prerelease' <<<"$release_json")" == "true" ]]; then
            echo "Refusing to package a draft or prerelease: $upstream_tag" >&2
            exit 1
          fi

          version="${upstream_tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unexpected upstream version: $version" >&2
            exit 1
          fi

          release_tag="alist-${upstream_tag}"
          should_build=true
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "${FORCE_BUILD:-false}" != "true" ]]; then
              should_build=false
            fi
          fi

          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "Resolved $upstream_tag (build: $should_build)"

  build:
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fnos_arch: x86
            upstream_arch: amd64
          - fnos_arch: arm
            upstream_arch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate project files
        run: ./scripts/check.sh

      - name: Install official fnpack
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$RUNNER_TEMP/fnpack" \
            "https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-linux-amd64"
          chmod 0755 "$RUNNER_TEMP/fnpack"
          "$RUNNER_TEMP/fnpack" --help >/dev/null

      - name: Read upstream asset digest
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
          UPSTREAM_ARCH: ${{ matrix.upstream_arch }}
        shell: bash
        run: |
          set -Eeuo pipefail
          asset="alist-linux-musl-${UPSTREAM_ARCH}.tar.gz"
          digest="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/tags/${UPSTREAM_TAG}" \
            --jq ".assets[] | select(.name == \"${asset}\") | .digest // empty")"

          if [[ ! "$digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "Missing or invalid SHA-256 digest for upstream asset: $asset" >&2
            exit 1
          fi

          echo "sha256=${digest#sha256:}" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Build fnOS package
        env:
          FN_PACK_BIN: ${{ runner.temp }}/fnpack
          ALIST_SHA256: ${{ steps.asset.outputs.sha256 }}
          REPOSITORY: ${{ github.repository }}
        run: |
          ./scripts/build-fpk.sh \
            "${{ needs.detect.outputs.upstream_tag }}" \
            "${{ matrix.fnos_arch }}" \
            dist

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlistFN-${{ needs.detect.outputs.version }}-${{ matrix.fnos_arch }}
          path: dist/*.fpk
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [detect, build]
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum *.fpk > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
          VERSION: ${{ needs.detect.outputs.version }}
          RELEASE_TAG: ${{ needs.detect.outputs.release_tag }}
        shell: bash
        run: |
          set -Eeuo pipefail

          upstream_url="https://github.com/${UPSTREAM_REPOSITORY}/releases/tag/${UPSTREAM_TAG}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            echo "AList ${VERSION} 的飞牛 fnOS 自动构建版本。"
            echo
            echo "- \`x86\` 包：适用于 x86_64/AMD64 设备"
            echo "- \`arm\` 包：适用于 ARM64 设备"
            echo "- 上游发布：${upstream_url}"
            echo "- AList 二进制未经修改，使用上游官方 musl 静态构建"
            echo
            echo "## 上游更新说明"
            echo
            gh api "repos/${UPSTREAM_REPOSITORY}/releases/tags/${UPSTREAM_TAG}" --jq '.body // ""'
          } > "$notes_file"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" \
              --title "AList ${VERSION} for fnOS" \
              --notes-file "$notes_file" \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "AList ${VERSION} for fnOS" \
              --notes-file "$notes_file" \
              --repo "$GITHUB_REPOSITORY"
          fi

